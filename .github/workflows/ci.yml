name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  smoke-backend:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: postgresql+psycopg2://ia_trab_user:ia_trab_pass@localhost:5432/ia_trab
      JWT_SECRET: dummy_jwt_secret_for_ci_which_is_long_enough_1234567890
      ADMIN_SEED_TOKEN: "dev-seed-123"
      ALLOW_SEED_ADMIN: "true"
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: ia_trab
          POSTGRES_USER: ia_trab_user
          POSTGRES_PASSWORD: ia_trab_pass
        ports:
          - "5432:5432"
        options: >-
          --health-cmd="pg_isready -U ia_trab_user -d ia_trab"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m venv ../.venv
          source ../.venv/bin/activate
          pip install -r requirements.txt

      - name: Run DB migrations (alembic upgrade head)
        working-directory: backend
        run: |
          source ../.venv/bin/activate
          alembic upgrade head

      - name: Install OS deps (psql client)
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      # RLS (BLOCO 2): migrations rodam como owner (DATABASE_URL do job); o app
      # roda com roles separadas, sem SUPERUSER/BYPASSRLS e sem ownership.
      # Senhas sintéticas, exclusivas deste Postgres efêmero de CI.
      - name: Bootstrap CI DB roles (runtime/admin, RLS)
        run: |
          psql "${DATABASE_URL/+psycopg2/}" -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'ia_rls_admin') THEN
              CREATE ROLE ia_rls_admin NOLOGIN NOSUPERUSER NOBYPASSRLS;
            END IF;
          END
          $$;
          CREATE ROLE ia_trab_ci_runtime LOGIN NOSUPERUSER NOBYPASSRLS NOCREATEDB NOCREATEROLE NOREPLICATION PASSWORD 'ci-runtime-pass';
          CREATE ROLE ia_trab_ci_admin LOGIN NOSUPERUSER NOBYPASSRLS NOCREATEDB NOCREATEROLE NOREPLICATION PASSWORD 'ci-admin-pass';
          GRANT ia_rls_admin TO ia_trab_ci_admin;
          GRANT CONNECT ON DATABASE ia_trab TO ia_trab_ci_runtime, ia_trab_ci_admin;
          GRANT USAGE ON SCHEMA public TO ia_trab_ci_runtime, ia_trab_ci_admin;
          GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO ia_trab_ci_runtime;
          GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA public TO ia_trab_ci_runtime;
          GRANT SELECT ON ALL TABLES IN SCHEMA public TO ia_trab_ci_admin;

          -- Validação fail-closed antes de subir o app.
          DO $$
          DECLARE
            r record;
          BEGIN
            IF NOT EXISTS (
              SELECT 1 FROM pg_roles
              WHERE rolname = 'ia_rls_admin' AND NOT rolcanlogin AND NOT rolsuper AND NOT rolbypassrls
            ) THEN
              RAISE EXCEPTION 'ia_rls_admin ausente ou com propriedades inseguras';
            END IF;

            IF (SELECT count(*) FROM pg_roles WHERE rolname IN ('ia_trab_ci_runtime', 'ia_trab_ci_admin')) <> 2 THEN
              RAISE EXCEPTION 'roles de CI ausentes';
            END IF;

            FOR r IN SELECT * FROM pg_roles WHERE rolname IN ('ia_trab_ci_runtime', 'ia_trab_ci_admin') LOOP
              IF NOT r.rolcanlogin OR r.rolsuper OR r.rolbypassrls OR r.rolcreatedb
                 OR r.rolcreaterole OR r.rolreplication THEN
                RAISE EXCEPTION 'role % com propriedades inseguras', r.rolname;
              END IF;
            END LOOP;

            IF EXISTS (
              SELECT 1 FROM pg_class c JOIN pg_roles o ON o.oid = c.relowner
              WHERE o.rolname IN ('ia_trab_ci_runtime', 'ia_trab_ci_admin')
            ) THEN
              RAISE EXCEPTION 'role de CI não pode ser owner de objetos';
            END IF;

            IF NOT pg_has_role('ia_trab_ci_admin', 'ia_rls_admin', 'MEMBER') THEN
              RAISE EXCEPTION 'ia_trab_ci_admin deve ser membro de ia_rls_admin';
            END IF;

            IF pg_has_role('ia_trab_ci_runtime', 'ia_rls_admin', 'MEMBER') THEN
              RAISE EXCEPTION 'ia_trab_ci_runtime não pode ser membro de ia_rls_admin';
            END IF;

            IF EXISTS (
              SELECT 1 FROM pg_tables
              WHERE schemaname = 'public'
                AND has_table_privilege('ia_trab_ci_admin', format('%I.%I', schemaname, tablename),
                                        'INSERT, UPDATE, DELETE, TRUNCATE')
            ) THEN
              RAISE EXCEPTION 'ia_trab_ci_admin deve ser somente leitura';
            END IF;

            IF NOT EXISTS (
              SELECT 1 FROM pg_class
              WHERE relnamespace = 'public'::regnamespace AND relrowsecurity AND relforcerowsecurity
            ) THEN
              RAISE EXCEPTION 'nenhuma tabela com RLS ENABLE+FORCE após migrations';
            END IF;
          END
          $$;
          SQL

      - name: Run backend smoke (start server + auth script)
        env:
          # App sob RLS: runtime (DML, sujeita às policies) e admin (SELECT, membro de ia_rls_admin).
          DATABASE_URL: postgresql+psycopg2://ia_trab_ci_runtime:ci-runtime-pass@localhost:5432/ia_trab
          ADMIN_DATABASE_URL: postgresql+psycopg2://ia_trab_ci_admin:ci-admin-pass@localhost:5432/ia_trab
        run: |
          cd backend
          source ../.venv/bin/activate

          uvicorn app.main:app --host 127.0.0.1 --port 8099 &
          PID=$!
          echo "Backend PID=$PID"

          for i in {1..30}; do
            echo "Waiting for backend (try $i)..."
            if curl -fsS "http://127.0.0.1:8099/api/v1/health" >/dev/null 2>&1; then
              echo "Backend is up."
              break
            fi
            sleep 1
          done

          cd ..
          chmod +x scripts/smoke_auth.sh
          ./scripts/smoke_auth.sh

          kill "$PID" || true


  contract-saas-limits:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: postgresql+psycopg2://ia_trab_user:ia_trab_pass@localhost:5432/ia_trab
      JWT_SECRET: dummy_jwt_secret_for_ci_which_is_long_enough_1234567890
      AUTH_ENABLED: "false"
      PLAN_BASIC_CASES_PER_MONTH: "2"
      PLAN_BASIC_AI_ANALYSES_PER_MONTH: "1"

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: ia_trab
          POSTGRES_USER: ia_trab_user
          POSTGRES_PASSWORD: ia_trab_pass
        ports:
          - "5432:5432"
        options: >-
          --health-cmd="pg_isready -U ia_trab_user -d ia_trab"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install OS deps (psql client)
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m venv ../.venv
          source ../.venv/bin/activate
          pip install -r requirements.txt

      - name: Run DB migrations (alembic upgrade head)
        working-directory: backend
        run: |
          source ../.venv/bin/activate
          alembic upgrade head

      - name: Run SaaS contract (limits + summary)
        working-directory: backend
        run: |
          source ../.venv/bin/activate
          chmod +x scripts/contract_saas_limits.sh
          PORT=18099 ./scripts/contract_saas_limits.sh


  frontend-classifier-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend tests
        working-directory: frontend
        run: npm test

      - name: Build frontend
        working-directory: frontend
        run: npm run build



  backend-full-suite:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ia_trab_test
          POSTGRES_USER: ia_trab_test_owner
          POSTGRES_PASSWORD: ia_trab_test_owner_pass
        ports:
          - "5432:5432"
        options: >-
          --health-cmd="pg_isready -U ia_trab_test_owner -d ia_trab_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      IA_TRAB_TEST_PG_OWNER_URL: postgresql+psycopg2://ia_trab_test_owner:ia_trab_test_owner_pass@127.0.0.1:5432/ia_trab_test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m venv ../.venv
          source ../.venv/bin/activate
          pip install -r requirements.txt

      - name: Run full backend test suite
        run: |
          .venv/bin/python -m pytest backend/tests -q

  backend-multicase-regression:
    runs-on: ubuntu-latest

    env:
      JWT_SECRET: dummy_jwt_secret_for_ci_which_is_long_enough_1234567890

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m venv ../.venv
          source ../.venv/bin/activate
          pip install -r requirements.txt

      - name: Run multicase editor regression
        run: |
          PYTHONPATH=backend .venv/bin/python -m pytest \
            backend/tests/test_massive_multicase_all_blocks_regression.py \
            backend/tests/test_case_operational_assistant_editor_block_routing.py \
            -q
